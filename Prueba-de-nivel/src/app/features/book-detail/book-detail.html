@if (book(); as book) {
  <article>
    <img [src]="book.image" [alt]="book.title" />
    <h1>Titulo: {{ book.title }}</h1>
    <p>Género literiario: {{ book.category }}</p>
    <p>Precio: {{ book.price | currency: 'EUR' }}</p>
    <p>Descripción: {{ book.description }}</p>
  </article>
} @else {
  <p>libro no encontrado</p>
}

<a routerLink="/books">Volver</a>
